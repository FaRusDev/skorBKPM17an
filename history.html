<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard - History Pertandingan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Graduate:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
      body {
        font-family: "Graduate", sans-serif;
        background-color: #f4f4f5;
        color: #18181b;
        min-height: 100vh;
      }
      * {
        transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      }
      .history-card {
        animation: fade-in 0.3s ease-out;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .conn-dot {
        width: 10px;
        height: 10px;
        border-radius: 9999px;
        display: inline-block;
        margin-right: 6px;
      }
    </style>
  </head>
  <body class="bg-[url(./assets/bbg.png)] bg-cover bg-fixed">
    <header class="bg-white/90 backdrop-blur-sm border-b border-white/60">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 py-4 grid grid-cols-1 gap-4 md:grid-cols-3 md:items-center">
        <div class="text-center md:text-left">
          <p class="text-xs font-bold uppercase tracking-[0.3em] text-slate-400">Kementerian</p>
          <h1 class="text-xl sm:text-2xl font-extrabold text-slate-800">History Pertandingan</h1>
          <p class="text-sm text-slate-500">Daftar semua pertandingan yang sudah selesai</p>
        </div>
        <div class="flex justify-center">
          <div class="rounded-2xl bg-white shadow-lg ring-1 ring-slate-200 px-5 py-3">
            <img
              src="./assets/bkpm.png"
              onerror="this.onerror=null;this.src='./assets/bkpm.jpg'"
              alt="Logo BKPM"
              class="h-16 sm:h-20 object-contain"
            />
          </div>
        </div>
        <div class="flex justify-center md:justify-end items-center text-xs sm:text-sm font-semibold text-slate-600">
          <span class="conn-dot bg-gray-400" id="conn-dot"></span>
          <span id="conn-text">Menghubungkan...</span>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 sm:px-6 py-6">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div class="rounded-2xl bg-white/90 px-4 py-2 shadow ring-1 ring-slate-200">
          <span class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Total Pertandingan</span>
          <span id="total-count" class="ml-2 text-lg font-extrabold text-slate-800">0</span>
        </div>
        <input
          id="search-input"
          type="text"
          placeholder="Cari cabor / tim / panitia..."
          class="w-full sm:w-72 rounded-2xl border border-slate-200 bg-white/90 px-4 py-2 text-sm shadow outline-none focus:ring-2 focus:ring-emerald-400"
        />
      </div>

      <div id="empty-state" class="hidden rounded-3xl border border-dashed border-slate-300 bg-white/80 px-6 py-16 text-center shadow-sm">
        <p class="text-2xl font-bold text-slate-500">Belum ada history pertandingan</p>
        <p class="text-slate-400 mt-2">Riwayat akan muncul otomatis setelah panitia mengakhiri pertandingan.</p>
      </div>

      <div id="table-wrapper" class="overflow-x-auto rounded-3xl border border-slate-200 bg-white/90 shadow-2xl">
        <table class="min-w-full divide-y divide-slate-200 text-left">
          <thead class="bg-slate-50">
            <tr>
              <th class="px-4 py-3 text-xs font-bold uppercase tracking-[0.2em] text-slate-500">No</th>
              <th class="px-4 py-3 text-xs font-bold uppercase tracking-[0.2em] text-slate-500">Pertandingan</th>
              <th class="px-4 py-3 text-xs font-bold uppercase tracking-[0.2em] text-slate-500">Panitia</th>
              <th class="px-4 py-3 text-xs font-bold uppercase tracking-[0.2em] text-slate-500">Skor</th>
              <th class="px-4 py-3 text-xs font-bold uppercase tracking-[0.2em] text-slate-500">Pemenang</th>
              <th class="px-4 py-3 text-xs font-bold uppercase tracking-[0.2em] text-slate-500">Tanggal</th>
            </tr>
          </thead>
          <tbody id="history-container" class="divide-y divide-slate-100 bg-white"></tbody>
        </table>
      </div>
    </main>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyA9rE3eh4H21_CJquRgJ13GQfWtyi4b3_g",
        authDomain: "skor-basket-bkpm.firebaseapp.com",
        databaseURL: "https://skor-basket-bkpm-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "skor-basket-bkpm",
        storageBucket: "skor-basket-bkpm.firebasestorage.app",
        messagingSenderId: "796797660486",
        appId: "1:796797660486:web:3f475ab7584c096d4c8947",
      }

      firebase.initializeApp(firebaseConfig)
      const db = firebase.database()

      // PENTING: kontrol.html menyimpan ke node root "history".
      // Node "scoreboard/history" dibaca juga supaya data versi lama tetap tampil.
      const SOURCES = ["history", "scoreboard/history"]

      const historyContainer = document.getElementById("history-container")
      const emptyState = document.getElementById("empty-state")
      const tableWrapper = document.getElementById("table-wrapper")
      const totalCount = document.getElementById("total-count")
      const searchInput = document.getElementById("search-input")

      const store = {} // { "path::key": data }
      let keyword = ""

      const toDateLabel = (timestamp) => {
        if (!timestamp) return "-"
        const d = new Date(timestamp)
        if (isNaN(d.getTime())) return "-"
        return (
          new Intl.DateTimeFormat("id-ID", {
            timeZone: "Asia/Jakarta",
            weekday: "long",
            day: "2-digit",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          }).format(d) + " WIB"
        )
      }

      const getFinishedAt = (item) => {
        if (typeof item.finishedAt === "number") return item.finishedAt
        if (item.finishedAtText) {
          const t = Date.parse(item.finishedAtText)
          if (!isNaN(t)) return t
        }
        return 0
      }

      const getWinner = (item) => {
        const scoreA = Number(item.scoreA ?? 0)
        const scoreB = Number(item.scoreB ?? 0)
        if (scoreA > scoreB) return item.teamAName || "TIM A"
        if (scoreB > scoreA) return item.teamBName || "TIM B"
        return "Seri"
      }

      // Buang record yang jelas bukan data pertandingan (mis. sisa node lama)
      const isValidMatch = (item) =>
        item &&
        typeof item === "object" &&
        !Array.isArray(item) &&
        ("scoreA" in item || "scoreB" in item || "teamAName" in item || "teamBName" in item)

      function render() {
        const items = Object.values(store)
          .filter(isValidMatch)
          .sort((a, b) => getFinishedAt(b) - getFinishedAt(a))

        const filtered = keyword
          ? items.filter((it) =>
              [it.sport, it.panitia, it.teamAName, it.teamBName]
                .join(" ")
                .toLowerCase()
                .includes(keyword)
            )
          : items

        totalCount.textContent = items.length
        historyContainer.innerHTML = ""

        if (filtered.length === 0) {
          emptyState.classList.remove("hidden")
          tableWrapper.classList.add("hidden")
          return
        }

        emptyState.classList.add("hidden")
        tableWrapper.classList.remove("hidden")

        filtered.forEach((item, index) => {
          const winner = getWinner(item)
          const row = document.createElement("tr")
          row.className = "history-card hover:bg-slate-50"
          row.innerHTML = `
            <td class="px-4 py-4 align-top text-sm font-bold text-slate-400">${index + 1}</td>
            <td class="px-4 py-4 align-top">
              <div class="font-extrabold text-slate-800">${item.teamAName || "TIM A"} vs ${item.teamBName || "TIM B"}</div>
              <div class="text-xs text-slate-400 mt-1">${item.sport || "-"} · Babak ${item.round || 1}</div>
            </td>
            <td class="px-4 py-4 align-top text-sm text-slate-600">${item.panitia || "-"}</td>
            <td class="px-4 py-4 align-top text-sm font-extrabold text-slate-800">${item.scoreA ?? 0} - ${item.scoreB ?? 0}</td>
            <td class="px-4 py-4 align-top text-sm font-bold ${winner === "Seri" ? "text-slate-500" : "text-emerald-600"}">${winner}</td>
            <td class="px-4 py-4 align-top text-sm text-slate-600 whitespace-nowrap">${toDateLabel(getFinishedAt(item))}</td>
          `
          historyContainer.appendChild(row)
        })
      }

      // Listener per sumber. Pakai .on("value") tanpa orderByChild/limit
      // supaya SEMUA record ikut terbaca, bukan cuma yang terbaru.
      SOURCES.forEach((path) => {
        db.ref(path).on(
          "value",
          (snap) => {
            Object.keys(store).forEach((k) => {
              if (k.startsWith(path + "::")) delete store[k]
            })
            snap.forEach((child) => {
              store[path + "::" + child.key] = child.val()
            })
            render()
          },
          (err) => console.warn("Gagal baca " + path, err)
        )
      })

      searchInput.addEventListener("input", (e) => {
        keyword = e.target.value.trim().toLowerCase()
        render()
      })

      db.ref(".info/connected").on("value", (snap) => {
        const dot = document.getElementById("conn-dot")
        const text = document.getElementById("conn-text")
        if (snap.val() === true) {
          dot.className = "conn-dot bg-emerald-500"
          text.textContent = "Terhubung (Live)"
        } else {
          dot.className = "conn-dot bg-red-500"
          text.textContent = "Terputus"
        }
      })

      render()
    </script>
  </body>
</html>
