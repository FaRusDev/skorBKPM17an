<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard - Panel Panitia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Graduate:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
      body {
        font-family: "Graduate", sans-serif;
        background-color: #ffff;
        color: #18181b;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      [contenteditable]:empty:before {
        content: attr(placeholder);
        color: #a1a1aa;
        font-weight: 500;
      }
      .score-update-animation {
        animation: score-pop 0.3s ease-out;
      }
      @keyframes score-pop {
        50% {
          transform: scale(1.1);
        }
      }
      * {
        transition: background-color 0.2s ease, color 0.2s ease,
          transform 0.15s ease, box-shadow 0.2s ease;
      }
      [contenteditable]:focus {
        background-color: #eef2ff;
        box-shadow: 0 0 0 2px #6366f1;
      }
      .conn-dot {
        width: 10px;
        height: 10px;
        border-radius: 9999px;
        display: inline-block;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <!-- ===================== GERBANG MASUK PANITIA ===================== -->
    <div
      id="gate-screen"
      class="min-h-screen flex items-center justify-center bg-[url(./assets/bg.png)] bg-cover p-4"
    >
      <div class="bg-white/95 rounded-3xl shadow-2xl p-8 max-w-md w-full">
        <img src="./assets/bkpm.png" alt="Logo BKPM" class="h-16 mx-auto mb-4" />
        <h1 class="text-2xl font-extrabold text-center text-slate-800 mb-1">
          Panel Panitia
        </h1>
        <p class="text-center text-slate-500 text-sm mb-6">
          Isi data pertandingan yang akan kamu pandu
        </p>

        <label class="text-xs font-semibold text-slate-500">Nama Panitia</label>
        <input
          id="gate-panitia"
          type="text"
          placeholder="Contoh: Budi"
          class="w-full p-3 mt-1 mb-4 bg-slate-100 rounded-xl text-lg font-semibold outline-none focus:ring-2 focus:ring-indigo-500"
        />

        <label class="text-xs font-semibold text-slate-500">Cabang Olahraga / Jenis Laga</label>
        <input
          id="gate-sport"
          type="text"
          placeholder="Contoh: Voli, Basket, Bulutangkis, Balap Karung"
          class="w-full p-3 mt-1 mb-4 bg-slate-100 rounded-xl text-lg font-semibold outline-none focus:ring-2 focus:ring-indigo-500"
        />

        <div class="grid grid-cols-2 gap-3 mb-6">
          <div>
            <label class="text-xs font-semibold text-slate-500">Nama Tim A</label>
            <input
              id="gate-team-a"
              type="text"
              placeholder="Tim A"
              class="w-full p-3 mt-1 bg-blue-50 rounded-xl text-lg font-semibold outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Nama Tim B</label>
            <input
              id="gate-team-b"
              type="text"
              placeholder="Tim B"
              class="w-full p-3 mt-1 bg-emerald-50 rounded-xl text-lg font-semibold outline-none focus:ring-2 focus:ring-emerald-500"
            />
          </div>
        </div>

        <button
          id="gate-start-btn"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg py-3 rounded-xl shadow-md transform hover:scale-[1.02]"
        >
          MULAI PANDU PERTANDINGAN
        </button>
        <p id="gate-error" class="text-red-500 text-xs text-center mt-3 hidden">
          Nama panitia dan cabang olahraga wajib diisi.
        </p>
      </div>
    </div>

    <!-- ===================== PANEL KONTROL SCOREBOARD ===================== -->
    <div
      id="control-screen"
      class="hidden h-screen flex flex-col justify-between items-center bg-[url(./assets/bbg.png)] bg-cover"
    >
      <div class="flex justify-between w-full items-center text-center px-4">
        <img src="./assets/bkpm.png" alt="Logo BKPM" class="h-32 mt-10" />
        <div class="flex flex-col items-end gap-1 mt-4">
          <div class="flex items-center text-xs sm:text-sm font-semibold text-slate-600">
            <span class="conn-dot bg-gray-400" id="conn-dot"></span>
            <span id="conn-text">Menghubungkan...</span>
          </div>
          <div class="text-xs text-slate-500">
            Panitia: <span id="panitia-label" class="font-bold"></span>
          </div>
        </div>
      </div>

      <div
        id="game-type"
        contenteditable="true"
        placeholder="Jenis Laga"
        class="text-4xl sm:text-5xl font-extrabold text-slate-700 outline-none rounded-lg px-2 py-1"
      >
        BASKET
      </div>
      <main class="sm:p-4 grid grid-cols-1 lg:grid-cols-3 gap-3 sm:gap-4">
        <section
          class="flex flex-col items-center justify-between text-center p-3 sm:p-6 bg-blue-600 rounded-2xl sm:rounded-3xl shadow-2xl border"
        >
          <div
            id="team-a-name"
            contenteditable="true"
            placeholder="Tim A"
            class="w-full text-3xl sm:text-4xl font-bold text-white outline-none rounded-lg px-2 py-1 focus:bg-slate-600"
          >
            TIM A
          </div>
          <div
            id="score-a"
            class="my-2 font-black text-white"
            style="font-size: clamp(5rem, 25vw, 12rem); line-height: 1"
          >
            0
          </div>
          <div class="w-full max-w-xs grid grid-cols-4 gap-2">
            <button onclick="updateScore('a', 1)" class="bg-blue-100 hover:bg-blue-200 h-14 rounded-lg font-semibold text-blue-800 text-xl transform hover:-translate-y-1">+1</button>
            <button onclick="updateScore('a', 2)" class="bg-blue-100 hover:bg-blue-200 h-14 rounded-lg font-semibold text-blue-800 text-xl transform hover:-translate-y-1">+2</button>
            <button onclick="updateScore('a', 3)" class="bg-blue-100 hover:bg-blue-200 h-14 rounded-lg font-semibold text-blue-800 text-xl transform hover:-translate-y-1">+3</button>
            <button onclick="updateScore('a', -1)" class="bg-red-100 hover:bg-red-200 h-14 rounded-lg font-semibold text-red-800 text-xl transform hover:-translate-y-1">-1</button>
          </div>
        </section>

        <section class="order-first lg:order-none flex flex-col items-center justify-center text-center gap-10 p-3">
          <div id="game-type-display" class="text-4xl sm:text-5xl font-extrabold text-slate-700 rounded-lg px-2 py-1">BASKET</div>
          <div id="timer-display" class="font-black text-slate-800" style="font-size: clamp(4.5rem, 22vw, 8rem); line-height: 1">00:00</div>
          <div id="round-display-text" class="text-xl sm:text-2xl font-bold text-slate-600">Babak 1</div>
        </section>

        <section
          class="flex flex-col items-center justify-between text-center p-3 sm:p-6 bg-emerald-600 rounded-2xl sm:rounded-3xl shadow-sm border border-gray-200/50"
        >
          <div
            id="team-b-name"
            contenteditable="true"
            placeholder="Tim B"
            class="w-full text-3xl sm:text-4xl font-bold text-white outline-none rounded-lg px-2 py-1 focus:bg-slate-600"
          >
            TIM B
          </div>
          <div
            id="score-b"
            class="my-2 font-black text-white"
            style="font-size: clamp(5rem, 25vw, 12rem); line-height: 1"
          >
            0
          </div>
          <div class="w-full max-w-xs grid grid-cols-4 gap-2">
            <button onclick="updateScore('b', 1)" class="bg-emerald-100 hover:bg-emerald-200 h-14 rounded-lg font-semibold text-emerald-800 text-xl transform hover:-translate-y-1">+1</button>
            <button onclick="updateScore('b', 2)" class="bg-emerald-100 hover:bg-emerald-200 h-14 rounded-lg font-semibold text-emerald-800 text-xl transform hover:-translate-y-1">+2</button>
            <button onclick="updateScore('b', 3)" class="bg-emerald-100 hover:bg-emerald-200 h-14 rounded-lg font-semibold text-emerald-800 text-xl transform hover:-translate-y-1">+3</button>
            <button onclick="updateScore('b', -1)" class="bg-red-100 hover:bg-red-200 h-14 rounded-lg font-semibold text-red-800 text-xl transform hover:-translate-y-1">-1</button>
          </div>
        </section>
      </main>

      <footer class="sticky bottom-0 w-full p-3 bg-transparent">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row gap-3">
          <div id="setup-controls" class="w-full sm:w-auto grid grid-cols-3 gap-2 bg-gray-300 p-2 rounded-xl border border-gray-200">
            <div class="flex flex-col items-center">
              <label class="text-xs font-medium text-gray-500">Babak</label>
              <input type="number" id="round-input" class="w-full p-2 bg-white text-center text-lg font-semibold rounded-lg" value="1" min="1" />
            </div>
            <div class="flex flex-col items-center">
              <label class="text-xs font-medium text-gray-500">Menit</label>
              <input type="number" id="minutes-input" class="w-full p-2 bg-white text-center text-lg font-semibold rounded-lg" value="10" min="0" />
            </div>
            <div class="flex flex-col items-center">
              <label class="text-xs font-medium text-gray-500">Detik</label>
              <input type="number" id="seconds-input" class="w-full p-2 bg-white text-center text-lg font-semibold rounded-lg" value="0" min="0" max="59" />
            </div>
          </div>
          <div class="w-full sm:flex-grow grid grid-cols-3 gap-3">
            <button id="start-pause-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg h-full rounded-xl shadow-md transform hover:scale-105">MULAI</button>
            <button id="reset-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold text-lg h-full rounded-xl shadow-md transform hover:scale-105">RESET</button>
            <button id="finish-btn" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold text-lg h-full rounded-xl shadow-md transform hover:scale-105">AKHIRI</button>
          </div>
        </div>
      </footer>
    </div>

    <div id="history-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
      <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[80vh] overflow-y-auto p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-bold text-slate-800">Riwayat Pertandingan</h2>
          <button onclick="closeHistoryModal()" class="text-slate-500 hover:text-slate-800 text-2xl font-bold leading-none">&times;</button>
        </div>
        <div id="history-list" class="space-y-3 text-sm"></div>
      </div>
    </div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyA9rE3eh4H21_CJquRgJ13GQfWtyi4b3_g",
        authDomain: "skor-basket-bkpm.firebaseapp.com",
        databaseURL: "https://skor-basket-bkpm-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "skor-basket-bkpm",
        storageBucket: "skor-basket-bkpm.firebasestorage.app",
        messagingSenderId: "796797660486",
        appId: "1:796797660486:web:3f475ab7584c096d4c8947",
      }

      firebase.initializeApp(firebaseConfig)
      const db = firebase.database()

      let matchId = null
      let matchRef = null
      let historyRef = db.ref("history")

      let scoreA = 0,
        scoreB = 0
      let timerInterval = null,
        totalSeconds = 0,
        isPaused = true
      let suppressWrite = false

      const gate = {
        screen: document.getElementById("gate-screen"),
        panitia: document.getElementById("gate-panitia"),
        sport: document.getElementById("gate-sport"),
        teamA: document.getElementById("gate-team-a"),
        teamB: document.getElementById("gate-team-b"),
        startBtn: document.getElementById("gate-start-btn"),
        error: document.getElementById("gate-error"),
      }

      const elements = {
        controlScreen: document.getElementById("control-screen"),
        scoreA: document.getElementById("score-a"),
        scoreB: document.getElementById("score-b"),
        timer: document.getElementById("timer-display"),
        startPauseBtn: document.getElementById("start-pause-btn"),
        resetBtn: document.getElementById("reset-btn"),
        finishBtn: document.getElementById("finish-btn"),
        minutesInput: document.getElementById("minutes-input"),
        secondsInput: document.getElementById("seconds-input"),
        roundInput: document.getElementById("round-input"),
        roundDisplayText: document.getElementById("round-display-text"),
        teamAName: document.getElementById("team-a-name"),
        teamBName: document.getElementById("team-b-name"),
        gameType: document.getElementById("game-type"),
        gameTypeDisplay: document.getElementById("game-type-display"),
        panitiaLabel: document.getElementById("panitia-label"),
        connDot: document.getElementById("conn-dot"),
        connText: document.getElementById("conn-text"),
        historyModal: document.getElementById("history-modal"),
        historyList: document.getElementById("history-list"),
        alarm: new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"),
      }

      function slugify(text) {
        return text
          .toString()
          .toLowerCase()
          .trim()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/(^-|-$)/g, "")
      }

      gate.startBtn.addEventListener("click", () => {
        const panitiaName = gate.panitia.value.trim()
        const sportName = gate.sport.value.trim()
        const teamA = gate.teamA.value.trim() || "TIM A"
        const teamB = gate.teamB.value.trim() || "TIM B"

        if (!panitiaName || !sportName) {
          gate.error.classList.remove("hidden")
          return
        }
        gate.error.classList.add("hidden")

        matchId = `${slugify(sportName)}-${slugify(panitiaName)}-${Date.now()}`
        matchRef = db.ref(`matches/${matchId}`)

        elements.panitiaLabel.textContent = panitiaName
        elements.gameType.textContent = sportName.toUpperCase()
        elements.gameTypeDisplay.textContent = sportName.toUpperCase()
        elements.teamAName.textContent = teamA.toUpperCase()
        elements.teamBName.textContent = teamB.toUpperCase()

        gate.screen.classList.add("hidden")
        elements.controlScreen.classList.remove("hidden")
        elements.controlScreen.classList.add("flex")

        setTimeToInput()
        updateRoundDisplay()
        pushState("live")
        listenMatch()
      })

      function listenMatch() {
        matchRef.on("value", (snap) => {
          const data = snap.val()
          if (!data) return
          suppressWrite = true
          scoreA = data.scoreA ?? 0
          scoreB = data.scoreB ?? 0
          totalSeconds = data.totalSeconds ?? 0
          isPaused = data.isPaused ?? true
          elements.scoreA.textContent = scoreA
          elements.scoreB.textContent = scoreB
          updateTimerDisplay()
          suppressWrite = false
        })
      }

      db.ref(".info/connected").on("value", (snap) => {
        if (snap.val() === true) {
          elements.connDot.className = "conn-dot bg-emerald-500"
          elements.connText.textContent = "Terhubung (Live)"
        } else {
          elements.connDot.className = "conn-dot bg-red-500"
          elements.connText.textContent = "Terputus"
        }
      })

      function pushState(status) {
        if (suppressWrite || !matchRef) return
        matchRef.set({
          sport: elements.gameType.textContent,
          panitia: elements.panitiaLabel.textContent,
          teamAName: elements.teamAName.textContent,
          teamBName: elements.teamBName.textContent,
          scoreA,
          scoreB,
          totalSeconds,
          isPaused,
          round: elements.roundInput.value || 1,
          status: status || "live",
          updatedAt: Date.now(),
        })
      }

      const updateRoundDisplay = () => {
        elements.roundDisplayText.textContent = `Babak ${elements.roundInput.value || 1}`
      }

      window.updateScore = (team, points) => {
        const isTeamA = team === "a"
        const scoreDisplay = isTeamA ? elements.scoreA : elements.scoreB
        if (isTeamA) {
          scoreA = Math.max(0, scoreA + points)
          scoreDisplay.textContent = scoreA
        } else {
          scoreB = Math.max(0, scoreB + points)
          scoreDisplay.textContent = scoreB
        }
        scoreDisplay.classList.add("score-update-animation")
        setTimeout(() => scoreDisplay.classList.remove("score-update-animation"), 300)
        pushState("live")
      }

      const formatTime = (seconds) =>
        `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`
      const updateTimerDisplay = () => {
        elements.timer.textContent = formatTime(totalSeconds)
      }

      const setTimeToInput = () => {
        clearInterval(timerInterval)
        isPaused = true
        elements.startPauseBtn.textContent = "MULAI"
        elements.startPauseBtn.className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg h-full rounded-xl shadow-md transform hover:scale-105"
        totalSeconds = (parseInt(elements.minutesInput.value) || 0) * 60 + (parseInt(elements.secondsInput.value) || 0)
        updateTimerDisplay()
        pushState("live")
      }

      const tick = () => {
        if (totalSeconds <= 0) {
          clearInterval(timerInterval)
          elements.startPauseBtn.textContent = "SELESAI"
          isPaused = true
          elements.alarm.play()
        } else {
          totalSeconds--
          updateTimerDisplay()
        }
        pushState("live")
      }

      const toggleTimer = () => {
        if (isPaused) {
          if (totalSeconds > 0) {
            isPaused = false
            elements.startPauseBtn.textContent = "PAUSE"
            elements.startPauseBtn.className = "w-full bg-amber-500 hover:bg-amber-600 text-white font-bold text-lg h-full rounded-xl shadow-md transform hover:scale-105"
            timerInterval = setInterval(tick, 1000)
          }
        } else {
          isPaused = true
          elements.startPauseBtn.textContent = "LANJUT"
          elements.startPauseBtn.className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg h-full rounded-xl shadow-md transform hover:scale-105"
          clearInterval(timerInterval)
        }
        pushState("live")
      }

      const resetGame = () => {
        if (confirm("reset pertandingan ke awal ?")) {
          scoreA = 0
          scoreB = 0
          elements.scoreA.textContent = 0
          elements.scoreB.textContent = 0
          updateRoundDisplay()
          setTimeToInput()
          pushState("live")
        }
      }

      const finishGame = () => {
        if (confirm("Akhiri pertandingan ini dan simpan hasil akhir ke riwayat?")) {
          clearInterval(timerInterval)
          isPaused = true
          const result = {
            sport: elements.gameType.textContent,
            panitia: elements.panitiaLabel.textContent,
            round: elements.roundInput.value || 1,
            teamAName: elements.teamAName.textContent,
            teamBName: elements.teamBName.textContent,
            scoreA,
            scoreB,
            finishedAt: Date.now(),
          }
          historyRef.push(result)
          pushState("finished")
          matchRef.remove()
          alert("Hasil pertandingan tersimpan ke riwayat, dan match ini dihapus dari tampilan live.")
        }
      }

      const openHistoryModal = () => {
        elements.historyList.innerHTML = "Memuat..."
        elements.historyModal.classList.remove("hidden")
        elements.historyModal.classList.add("flex")
        historyRef
          .orderByChild("finishedAt")
          .limitToLast(50)
          .once("value", (snap) => {
            const items = []
            snap.forEach((child) => items.push(child.val()))
            items.reverse()
            if (items.length === 0) {
              elements.historyList.innerHTML = '<p class="text-slate-400">Belum ada riwayat pertandingan.</p>'
              return
            }
            elements.historyList.innerHTML = items
              .map((it) => {
                const date = new Date(it.finishedAt).toLocaleString("id-ID")
                const winner =
                  it.scoreA > it.scoreB ? it.teamAName : it.scoreB > it.scoreA ? it.teamBName : "Seri"
                return `<div class="border border-slate-200 rounded-xl p-3">
                  <div class="text-xs text-slate-400">${date} · ${it.sport} · Babak ${it.round} · Panitia: ${it.panitia || "-"}</div>
                  <div class="flex justify-between items-center mt-1 font-bold text-slate-800">
                    <span>${it.teamAName}</span>
                    <span class="text-xl">${it.scoreA} - ${it.scoreB}</span>
                    <span>${it.teamBName}</span>
                  </div>
                  <div class="text-xs text-emerald-600 font-semibold mt-1">Pemenang: ${winner}</div>
                </div>`
              })
              .join("")
          })
      }

      window.closeHistoryModal = () => {
        elements.historyModal.classList.add("hidden")
        elements.historyModal.classList.remove("flex")
      }

      elements.startPauseBtn.addEventListener("click", toggleTimer)
      elements.resetBtn.addEventListener("click", resetGame)
      elements.finishBtn.addEventListener("click", finishGame)
      elements.finishBtn.addEventListener("dblclick", openHistoryModal)
      elements.minutesInput.addEventListener("input", setTimeToInput)
      elements.secondsInput.addEventListener("input", setTimeToInput)
      elements.roundInput.addEventListener("input", () => {
        updateRoundDisplay()
        pushState("live")
      })
      elements.teamAName.addEventListener("input", () => pushState("live"))
      elements.teamBName.addEventListener("input", () => pushState("live"))
      elements.gameType.addEventListener("input", () => {
        elements.gameTypeDisplay.textContent = elements.gameType.textContent
        pushState("live")
      })
    </script>
  </body>
</html>
